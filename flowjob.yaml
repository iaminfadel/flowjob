scout:
  max_scrape_per_run: 2
  time_filter: "past_24_hours"
  
analyst:
  model: "gemini-3.1-flash-lite"
  min_fit_score: 50
  
tailor:
  model: "gemini-3.1-flash-lite"
  
editor:
  model: "gemini-3.1-flash-lite"
  min_keyword_coverage: 75

critic:
  model: "gemini-3.1-flash-lite"

writer:
  model: "gemini-3.1-flash-lite"
  max_writer_rounds: 3

grilling:
  model: "gemini-3.1-flash-lite"
  max_turns_per_gap: 5

auditor:
  model: "gemini-3.1-flash-lite"
  max_attempts: 3

applicator:
  max_apps_per_day: 100
  max_apps_per_hour: 10
  dry_run: false
  require_approval: true
  
llm:
  default_model: "gemini-3.1-flash-lite"
  llm_timeout_seconds: 60
  max_retries: 3
  openrouter_base_url: "https://openrouter.ai/api/v1"
  # Provider chain (priority order). Tested 2026-08-17:
  # - openrouter qwen: needs credits topped up (402 currently)
  # - gemini-lite: primary workhorse during testing (free, 20 req/day/model)
  # - orca: free quota exhausted (403 currently)
  providers:
    - name: openrouter
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: OPENROUTER_API_KEY
      model: "qwen/qwen3.8-27b"
      priority: 1
    - name: gemini-lite
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: GEMINI_API_KEY
      model: "gemini-3.1-flash-lite"
      priority: 2
    - name: gemini-lite-latest
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: GEMINI_API_KEY
      model: "gemini-flash-lite-latest"
      priority: 3
    - name: gemini-35
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: GEMINI_API_KEY
      model: "gemini-3.5-flash"
      priority: 4
    - name: gemini-36
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: GEMINI_API_KEY
      model: "gemini-3.6-flash"
      priority: 5
    - name: orca
      base_url: "https://api.orcarouter.ai/v1"
      api_key_env: ORCAROUTER_API_KEY
      model: "orcarouter/free"
      priority: 6
  
data:
  data_retention_days: 90
  db_path: "flowjob.db"
  output_dir: "output/"
  browser_data_dir: "browser_data/"
