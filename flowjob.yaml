scout:
  search_queries: ["software engineer Egypt remote", "backend engineer Cairo"]
  max_scrape_per_run: 30
  
analyst:
  min_fit_score: 70
  
editor:
  min_keyword_coverage: 75
  
applicator:
  max_apps_per_day: 10
  max_apps_per_hour: 1
