[project]
name = "flowjob"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.39",
    "typer>=0.27.1",
    "jinja2>=3.1.4",
    "pymupdf>=1.24.9",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "textual>=8.2,<9",
    "ruamel-yaml>=0.18,<0.19",
]

[project.scripts]
flowjob = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: real-browser end-to-end tests; skipped unless FLOWJOB_E2E=1 is set",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest-asyncio>=1.4.0",
]

